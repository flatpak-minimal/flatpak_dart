name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  # Authenticates to pub.dev with a short-lived GitHub-signed OIDC token, so
  # there is no publishing secret to store or rotate. Requires automated
  # publishing to be enabled for this package on its pub.dev admin page, with
  # a tag pattern matching the trigger above.
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
