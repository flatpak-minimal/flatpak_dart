name: flutter_remote_manager
description: >
  Flutter example — manage Flatpak remotes with the flatpak_dart package.
  Demonstrates add / remove / active-selection / package browsing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # The package under development — path dep so the example runs from the repo.
  flatpak_dart:
    path: ../..
  provider: ^6.1.2
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500