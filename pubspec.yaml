name: flatpak_dart
description: >-
  Typed Dart API for managing Flatpak applications on Linux. Drives libflatpak
  via a C++23 FFI bridge: list, install, update, uninstall, remotes and
  permissions.
version: 0.2.0
repository: https://github.com/flatpak-minimal/flatpak_dart
issue_tracker: https://github.com/flatpak-minimal/flatpak_dart/issues
homepage: https://github.com/flatpak-minimal/flatpak_dart

platforms:
  linux:

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # hooks and code_assets are used only by hook/build.dart, which is source
  # compatible across both API generations. The ranges stay wide so that a
  # Flutter SDK pinning meta 1.18.0 can still resolve: hooks 2.x requires
  # meta ^1.19.0, which such an SDK excludes.
  appstream_dart: ^0.3.0
  code_assets: ">=0.19.7 <2.0.0"
  ffi: ^2.1.0
  hooks: ">=0.20.1 <3.0.0"
  path: ^1.9.0

dev_dependencies:
  test: ^1.24.0
  lints: ^6.1.0

topics: [linux, flatpak, desktop, ffi, libflatpak]
