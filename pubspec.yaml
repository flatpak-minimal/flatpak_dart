name: flatpak_dart
description: >
  Typed Dart API for managing Flatpak applications on Linux.
  Uses native_comms + libflatpak C API for zero-copy integration.
  No D-Bus client library required.
version: 0.1.0
repository: https://github.com/<org>/flatpak_dart

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  ffi: ^2.1.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.24.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  lints: ^4.0.0
  coverage: ^1.7.0

topics: [linux, flatpak, desktop, ffi, libflatpak]
